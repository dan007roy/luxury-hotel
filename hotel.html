<script>
/* ---------- procedural textures (no image files needed) ---------- */
const TX={};
function tex(k,a,b){
  const key=k+a+b;if(TX[key])return TX[key];
  const s=512,cv=document.createElement('canvas');cv.width=cv.height=s;
  const g=cv.getContext('2d'),r=Math.random;

  if(k=='wood'){
    for(let i=0;i<4;i++){const y=i*128;
      g.fillStyle=`rgba(0,0,0,${r()*.14})`;g.fillRect(0,y,s,128);
      for(let j=0;j<45;j++){g.strokeStyle=`rgba(${r()<.5?'40,20,5':'255,220,170'},${r()*.1})`;g.lineWidth=1+r()*2;
        const yy=y+r()*128;g.beginPath();g.moveTo(0,yy);g.bezierCurveTo(150,yy+r()*10-5,350,yy+r()*10-5,s,yy);g.stroke()}
      g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,y,s,2);g.fillRect(r()*s,y,2,128)}
  }else if(k=='tile'){
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`rgba(${r()<.5?'0,0,0':'255,255,255'},${r()*.07})`;g.fillRect(i*128,j*128,128,128)}

    for(let x=0;x<s;x+=64){g.globalAlpha=.35;g.fillStyle=b;g.fillRect(x,0,32,s);g.globalAlpha=1;g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x+30,0,2,s)}
    noise(4000,.05);

  }else if(k=='mirror'){
    const gr=g.createLinearGradient(0,0,s,s);gr.addColorStop(0,a);gr.addColorStop(.5,b);gr.addColorStop(1,a);
    g.fillStyle=gr;g.fillRect(0,0,s,s);g.fillStyle='rgba(255,255,255,.35)';
    g.beginPath();g.moveTo(s*.2,0);g.lineTo(s*.4,0);g.lineTo(s*.1,s);g.lineTo(0,s);g.fill();
    g.beginPath();g.moveTo(s*.55,0);g.lineTo(s*.62,0);g.lineTo(s*.32,s);g.lineTo(s*.25,s);g.fill();

    const gr=g.createLinearGradient(0,0,0,s);gr.addColorStop(0,'#10204a');gr.addColorStop(.6,'#c8708a');gr.addColorStop(1,'#f6b66b');
    g.fillStyle=gr;g.fillRect(0,0,s,s);g.fillStyle='#14182c';
    for(let x=0;x<s;x+=24){const h=40+r()*130;g.fillRect(x,s-h,22,h);

  }

  t.wrapS=t.wrapT=AFRAME.THREE.RepeatWrapping;t.colorSpace=AFRAME.THREE.SRGBColorSpace;t.anisotropy=8;
  return TX[key]=t;
}
/* applies a procedural texture, tiled to real-world size (s metres per tile) */
AFRAME.registerComponent('ptex',{
  schema:{k:{},a:{default:'#999'},b:{default:'#555'},s:{default:1.5}},
  init(){
    const go=()=>{
      const m=this.el.getObject3D('mesh');if(!m||!m.material||this.done)return;this.done=1;
      const g=this.el.getAttribute('geometry'),d=[g.width||1,g.height||1,g.depth||0].sort((x,y)=>y-x);
      const t=tex(this.data.k,this.data.a,this.data.b).clone();
      t.repeat.set(Math.max(1,d[0]/this.data.s),Math.max(1,d[1]/this.data.s));t.needsUpdate=true;
      m.material.map=t;m.material.color.set('#ffffff');m.material.needsUpdate=true;
    };
    this.el.addEventListener('object3dset',go);go();
  }
});
/* simple walking bounds so you stay inside the hotel and out of the furniture */
const OK=[[-1.3,1.3,2.35,13.3],[-.5,.5,1.7,2.5],[-3.7,3.7,-3.4,1.9],[-3.7,1.3,-7.7,-3.3],[1.75,3.85,-7.7,-3.7],[2.35,3.25,-3.8,-3.3]];
const NO=[[-2.5,.1,-8,-5.4],[-4,-3.1,-7,-3.2],[-4,-3.2,-2.3,-.5],[3.1,4,-1.7,.7],[2.0,3.9,-8,-7.0],[2.1,3.1,.9,1.8],[1.0,1.5,8.8,10.2],[-1.5,-.8,3.2,4.8],[-3.6,-1,1.4,2],[1.9,2.3,-5.5,-4.3]];
const ins=(x,z,q)=>x>q[0]&&x<q[1]&&z>q[2]&&z<q[3];
const ok=(x,z)=>OK.some(q=>ins(x,z,q))&&!NO.some(q=>ins(x,z,q));
AFRAME.registerComponent('bounds',{
  init(){this.o={x:this.el.object3D.position.x,z:this.el.object3D.position.z}},
  tick(){const p=this.el.object3D.position,o=this.o;
    if(!ok(p.x,p.z)){if(ok(p.x,o.z))p.z=o.z;else if(ok(o.x,p.z))p.x=o.x;else{p.x=o.x;p.z=o.z}}
    o.x=p.x;o.z=p.z}
});

  B(s*1.43,2.3,z,.12,.1,1.22,'white')+B(s*1.38,1.75,z,.02,.13,.26,'gold')+B(s*1.37,1.05,z+.38,.05,.04,.18,'gold')+
  `<a-text value="${n}" align="center" width=".5" color="#2a1c10" position="${s*1.365} 1.75 ${z}" rotation="0 ${s*90} 0"></a-text>`;
const sconce=(s,z)=>B(s*1.47,1.95,z,.04,.4,.2,'gold')+B(s*1.43,1.95,z,.1,.28,.12,'bulb');
